<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Card Component</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-4">
          <div class="card shadow-sm">
            <img
              src="https://www.psccomputer.com.kh/image/0913b03c0f283a9ff016df0b34c6ff66.png"
              class="card-img-top"
              alt=" Product Image"
            />

            <div class="card-body">
              <h5 class="card-title fw-bold">Computer</h5>
              <p class="card-text text-muted">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Non quibusdam voluptas corrupti, ducimus repellat iste.
              </p>
              <p class="text-danger fw-bold fs-5">Price: $999</p>
              <a href="#" class="btn btn-primary w-100">Buy Now</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
