<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-Introduction</title>
</head>
<body>
    <h2>Form of Information</h2>
    <form action="">
        <fieldset>
            <legend><b>Information</b></legend>
            <p>
                <label for="fullname">Full name</label> <br>
                <input type="text" id="fullname" name="fullname" placeholder="Thi Chhorvorn" required>
            </p>
            <p>
                <label for="email">Email</label> <br>
                <input type="text" id="email" name="email" placeholder="you@gmail.com" required>
            </p>
            <p>
                <label for="passowrd">Password</label> <br>
                <input type="password" id="password" name="password" placeholder="chhorvorn123#$">
            </p>
            <button type="submit"> Submit </button>
            <select name="city" id="city">
                <option value="phnom penh">Phnom Penh</option>
                <option value="phnom penh">Seim Reab</option>
                <option value="phnom penh">Prey Veng</option>
                <option value="phnom penh">Phnom Penh</option>
            </select>
        </fieldset>
    </form>
</body>
</html>
