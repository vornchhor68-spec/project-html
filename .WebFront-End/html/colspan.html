<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colunm-Span & Row-span</title>
</head>
<body>
    <!-- colspan and rowspan. Merge colunm or row -->
    <h1>Merge Colunm</h1>
    <table border="1" cellspacing="0">
        <tr>
            <th colspan="3">Table of Price</th>
        </tr>
        <tr>
            <th>No.</th>
            <th>Name</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>1.</td>
            <td>Ice latte</td>
            <td>1.25$</td>
        </tr>
        <tr>
            <td>2.</td>
            <td>Macha latte</td>
            <td>2.25$</td>
        </tr>
        <tr>
            <td>3.</td>
            <td>Macha Strawberry</td>
            <td>2.50$</td>
        </tr>
        <tr>
            <td>4.</td>
            <td>Milk</td>
            <td>2.00$</td>
        </tr>
        <tr>
            <td colspan="2"><b>Total</b></td>
            <td><b>6.00$</b></td>
        </tr>
    </table>
    <h1>Merge Row</h1>
    <table border="1" cellspacing="0">
        <tr>
            <th rowspan="2">No.</th>
            <th rowspan="2">Name Student</th>
            <th colspan="2">Exam score</th>
            <th rowspan="2">Result</th>
        </tr>
        <tr>
            <th>HTML</th>
            <th>CSS</th>
        </tr>
        <tr>
            <td>0001</td>
            <td>Sok Panha</td>
            <td>75</td>
            <td>60</td>
            <td>Pass</td>
        </tr>
        <tr>
            <td>0002</td>
            <td>Ban Thyda</td>
            <td>75</td>
            <td>60</td>
            <td>Pass</td>
        </tr>
        <tr>
            <td>0003</td>
            <td>Bon Chenghak</td>
            <td>75</td>
            <td>60</td>
            <td>Pass</td>
        </tr>
        <tr>
            <td colspan="4"><b>Total of Student</b></td>
            <td><b>3</b></td>
        </tr>
    </table>
</body>
</html>
