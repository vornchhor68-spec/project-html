<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>ឧទាហរណ៍ Modal Pop-up</title>
    <link rel="stylesheet" href="style-flex.css">
</head>
<body>

    <!-- ប៊ូតុងសម្រាប់បើក Modal -->
    <button id="openBtn" class="btn">ចុចទីនេះដើម្បីបើក Modal</button>

    <!-- រចនាសម្ព័ន្ធប្រអប់ Modal -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>សួស្តី!</h2>
            <p>នេះគឺជាប្រអប់ Modal Pop-up សាមញ្ញដែលបង្កើតឡើងដោយ HTML, CSS និង JavaScript។</p>
            <button id="closeModalBtn" class="btn-primary">យល់ព្រម</button>
        </div>
    </div>

    <script src="test-flix.js"></script>
</body>
</html>
