<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-test.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="banner-container">
      <div class="top-discount-badge">⚡ បញ្ចុះតម្លៃពិសេស ៤០%</div>
      <div class="banner-column banner-left">
        <p class="sub-heading">New Generation Tech 2026</p>
        <h1 class="main-heading">
          កំពូលបច្ចេកវិទ្យាទំនើប គុណភាពខ្ពស់ និងតម្លៃសមរម្យ
        </h1>
        <p class="description">
          ទទួលបានបទពិសោធន៍ទិញទំនិញអេឡិចត្រូនិក ១០០% ជាមួយនឹងការធានាផ្លូវការ
          និងការដឹកជញ្ជូនរហ័សទូទាំងប្រទេស។
        </p>
        <button class="cta-button">🛒 ទិញឥឡូវនេះ</button>
      </div>
      <div class="banner-column banner-right">
        <div class="yellow-card">
          <img src="headphones.png" alt="Headphones" class="product-image" />
          <div class="card-floating-badge">⭐ ផលិតផលលក់ដាច់បំផុតប្រចាំខែ</div>
        </div>
      </div>
    </div>
  </body>
</html>
